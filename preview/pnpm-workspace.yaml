# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: .sites-runtime/pnpm-store
cacheDir: .sites-runtime/pnpm-store/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  'sharp': '0.35.5'
  'browserslist': '^4.28.7'
  'baseline-browser-mapping': '^2.11.0'
  'fast-uri': '^3.1.9'
  'source-map-js': '^1.2.2'
  '@babel/core': '^7.29.6'
  'esbuild': '0.28.1'
  'ws': '^8.21.0'
  'undici': '^7.30.1'
  'js-yaml': '^4.3.2'
  'brace-expansion@<2': '^1.1.21'
  'brace-expansion@>=2': '^5.0.12'
  'fflate': '^0.7.5'
  'image-size': '^2.0.3'
  'satori': '^0.33.5'
  'zod': '^4.6.6'
  'minimatch@>=7': '^11.0.1'
  'react-server-dom-webpack': '19.2.9'
  'vite': '8.1.6'
