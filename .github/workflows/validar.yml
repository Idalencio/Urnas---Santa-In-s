name: Validar projeto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Os testes usam dados fictícios e não precisam escrever no repositório.
permissions:
  contents: read

jobs:
  php-e-interface:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Senha fictícia deste serviço temporário, sem vínculo com a escola.
          MARIADB_ROOT_PASSWORD: urna_ci_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preparar PHP e Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
      - name: Instalar dependências da interface
        run: npm ci
      - name: Auditar dependências da interface
        run: |
          npm audit
          npm ci --prefix frontend
          npm audit --prefix frontend
      - name: Conferir formatação e tipos
        run: |
          npm run format:check
          npm run check:v2
          npm run check:legacy
          npm run test:tally
          npm run test:security
      - name: Compilar a interface V2
        run: npm run build:v2
      - name: Conferir sintaxe PHP
        run: find server bin config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testar o fluxo HTTP e a preservação dos dados
        env:
          URNA_TEST_DB_HOST: 127.0.0.1
          URNA_TEST_DB_PORT: '3306'
          URNA_TEST_DB_USER: root
          URNA_TEST_DB_PASSWORD: urna_ci_local
        run: .venv/bin/python tests/run-http.py

  previa-e-seguranca:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar pnpm e dependências fixadas
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Auditar dependências da prévia
        run: pnpm audit
      - name: Validar APIs e proteção administrativa
        run: |
          node scripts/check-demo.mjs
          node scripts/check-team.mjs
          node scripts/check-roster.mjs
          node scripts/check-delete-election.mjs
          node scripts/check-import.mjs
          node scripts/check-tally.mjs
          node scripts/check-lifecycle.mjs
          node scripts/check-multi-election.mjs
          node scripts/check-security.mjs
          node scripts/check-http-security.mjs
          pnpm exec tsc --noEmit
