# No Vhost do SITE DA URNA, no bloco server que processa PHP
# (o mesmo que contém fastcgi_pass; normalmente listen 8080),
# substitua o location / existente por este, ou adicione se não existir.
# Preserve os blocos SSL, FastCGI e a porta PHP-FPM gerados pelo CloudPanel.
# Preserve também o proxy_pass no servidor público 80/443, quando existir.
# Root Directory deve apontar para a pasta public/ deste projeto.
location / {
    try_files $uri /index.php?$query_string;
}

# O CloudPanel pode ter um bloco location /api com proxy/caching: remova-o
# apenas no site da urna, se existir. APIs precisam chegar ao index.php.
# Aumente client_max_body_size para 4m (no bloco server), caso esteja menor.
# Não habilite Varnish/cache de página nas APIs, painel ou votação.

# Defesa adicional mesmo com public/ configurado: não servir repositório, backups ou dados internos.
# Coloque estes blocos antes dos outros location com expressões regulares.
location ~ (^|/)\.(?!well-known/) { return 404; }
location ~* ^/(?:config|server|database|storage|tests|bin|frontend|preview|node_modules|vendor)(?:/|$) { return 404; }
location ~* \.(?:sql|sqlite3?|db|log|bak|backup|old|orig|key|pem|env|map|zip|tar|gz|tgz|7z)(?:$|/) { return 404; }
# Inclua também no server público 80/443 se ele servir arquivos estáticos diretamente.
